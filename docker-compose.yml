  #     DATABASE_URL: postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - homelab-network

volumes:
  postgres-data:
    driver: local

networks:
  homelab-network:
    driver: bridge

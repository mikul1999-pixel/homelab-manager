[build-system]
requires = ["hatchling"] 
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/homelab"]

[project]
name = "homelab-manager"
version = "0.1.0"
description = "Docker container version management and monitoring for home labs"
requires-python = ">=3.10"
dependencies = [
    "docker",
    "sqlalchemy",
    "pyyaml",
    "click",
    "psycopg2-binary",
    "python-dotenv",
    "apscheduler",
    "uvicorn",
    "fastapi",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
homelab = "homelab.cli.main:cli"
homelab-api = "homelab.api.cli:main"
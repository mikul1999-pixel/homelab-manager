[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-manager"
version = "0.1.0"
description = "Docker container version management and monitoring for home labs"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
dashboard = [
    "dash>=2.14.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
]

[project.scripts]
homelab = "homelab.cli.main:cli"